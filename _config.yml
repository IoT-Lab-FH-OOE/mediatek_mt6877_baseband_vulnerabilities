title: Transient Denial of Service Vulnerabilities in MediaTek Dimensity 1080/7050 (MT6877)'s 5G Baseband
description: Multiple transient denial of service (DoS) vulnerabilities can be triggered in MediaTek Dimensity 1080/7050 (MT6877)'s integrated 5G baseband using unauthenticated downlink radio resource control (RRC) setup messages without requiring user interaction.